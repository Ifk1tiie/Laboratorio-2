<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Permite utilizar caracteres especiales correctamente -->
    <meta charset="UTF-8">

    <!-- Hace que la página se adapte a diferentes tamaños de pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Conecta el archivo HTML con la hoja de estilos CSS -->
    <link rel="stylesheet" href="estilosParrafos.css">

    <!-- Título de la página -->
    <title>Ejemplo #3</title>
</head>

<body>

    <!--
        Párrafo que contiene una cita y palabras
        resaltadas con la etiqueta <strong>.
    -->
    <p>
        Jon said,
        <q>
            That’ll be Good when it’s <strong>finished</strong>.
        </q>
        If only he <strong>knew</strong>!
    </p>

</body>

</html>
