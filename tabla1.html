<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Permite utilizar correctamente las tildes y la ñ -->
    <meta charset="UTF-8">

    <!-- Hace que la página se adapte a diferentes tamaños de pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Metadatos de la página -->
    <meta name="Description" content="Informe de gastos de viaje">
    <meta name="Keywords" content="tabla, gastos, viaje">
    <meta name="Distribution" content="Global">
    <meta name="Author" content="Autor - Correo">
    <meta name="Robots" content="index,follow">

    <!--
        Icono que aparece en la pestaña del navegador.
        La imagen debe estar dentro de la carpeta img.
    -->
    <link rel="shortcut icon" href="img/b_2110.ico">

    <!-- Nombre que aparece en la pestaña del navegador -->
    <title>Ejemplo de Tabla</title>

</head>

<body>

    <!-- Tabla de informe de gastos de viaje -->
    <table>

        <!-- Título de la tabla -->
        <caption>Informe de gastos de viaje</caption>

        <!-- Encabezados de las columnas -->
        <tr>
            <th></th>
            <th>Comida</th>
            <th>Hotel</th>
            <th>Transporte</th>
            <th>Subtotal</th>
        </tr>

        <!-- Ciudad de Buenos Aires -->
        <tr>
            <th id="buenos-aires" axis="buenos-aires">
                Buenos Aires
            </th>
        </tr>

        <!-- Gastos del 25 de agosto -->
        <tr>
            <th headers="buenos-aires">25-Ago-97</th>
            <td>37.34</td>
            <td>112.00</td>
            <td>45.00</td>
            <td></td>
        </tr>

        <!-- Gastos del 26 de agosto -->
        <tr>
            <th headers="buenos-aires">26-Ago-97</th>
            <td>27.28</td>
            <td>112.00</td>
            <td>45.00</td>
            <td></td>
        </tr>

        <!-- Subtotal de Buenos Aires -->
        <tr>
            <th headers="buenos-aires">Subtotales</th>
            <td>65.00</td>
            <td>224.00</td>
            <td>90.00</td>
            <td>379.02</td>
        </tr>

        <!-- Ciudad de Córdoba -->
        <tr>
            <th id="cordoba" axis="cordoba">
                Córdoba
            </th>
        </tr>

        <!-- Gastos del 27 de agosto -->
        <tr>
            <th headers="cordoba">27-ago97</th>
            <td>96.00</td>
            <td>109.00</td>
            <td>36.00</td>
            <td></td>
        </tr>

        <!-- Gastos del 28 de agosto -->
        <tr>
            <th headers="cordoba">28-ago97</th>
            <td>35.00</td>
            <td>109.00</td>
            <td>36.00</td>
            <td></td>
        </tr>

        <!-- Subtotal de Córdoba -->
        <tr>
            <th headers="cordoba">Subtotales</th>
            <td>196.27</td>
            <td>442.00</td>
            <td>162.00</td>
            <td>800.27</td>
        </tr>

    </table>

</body>

</html>
